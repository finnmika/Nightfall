plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Compile the decompiled source against Fabric intermediary names (class_####).
    mappings "net.fabricmc:intermediary:${minecraft_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Needed on the compile classpath; fabric.mod.json nests the same jar at runtime.
    compileOnly files("src/main/java/META-INF/jars/seedcrackerX-2.15.6.jar")
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Configure lazily so this also works if Loom registers sourcesJar after this script.
tasks.configureEach {
    if (name == 'sourcesJar') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

jar {
    from('src/main/java') {
        include 'META-INF/jars/**'
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
